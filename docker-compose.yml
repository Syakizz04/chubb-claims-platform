name: chubb-claims

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: claims
      POSTGRES_PASSWORD: claims
      POSTGRES_DB: claims
    ports:
      - "5433:5432"   # 5433 on the host to avoid clashing with a local Postgres
    volumes:
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Check over TCP, not the unix socket. During first boot the entrypoint runs a temporary
      # socket-only server to execute init.sql; a socket check would pass before the insights
      # database exists, and the APIs could race it.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U claims -d insights"]
      interval: 3s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    environment:
      # Single-node KRaft (no ZooKeeper). Two listeners: one for containers, one for the host.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"  # topics are created explicitly by the Claims API
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  claims-api:
    build:
      context: ./backend
      args: { PROJECT: Claims.Api }
    environment:
      ConnectionStrings__Claims: Host=postgres;Port=5432;Database=claims;Username=claims;Password=claims
      Kafka__BootstrapServers: kafka:29092
      Cors__Origins__0: http://localhost:4200
    ports:
      - "5001:8080"
    restart: on-failure   # e.g. a transient DB error during startup migrations
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }

  insights-api:
    build:
      context: ./backend
      args: { PROJECT: Insights.Api }
    environment:
      ConnectionStrings__Insights: Host=postgres;Port=5432;Database=insights;Username=claims;Password=claims
      Kafka__BootstrapServers: kafka:29092
      Cors__Origins__0: http://localhost:4200
    ports:
      - "5002:8080"
    restart: on-failure
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      # Deliberately NOT depending on claims-api: Insights must start and run without it (E-4).

  frontend:
    build: ./frontend
    ports:
      - "4200:80"
    depends_on:
      - claims-api
      - insights-api

volumes:
  pgdata:
