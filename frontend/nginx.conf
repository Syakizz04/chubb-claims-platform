server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Same routing as the dev proxy: Insights first (more specific), then Claims.
  location /api/insights/ { proxy_pass http://insights-api:8080; }
  location /api/          { proxy_pass http://claims-api:8080; }

  # Single-page app: unknown paths serve index.html so deep links work.
  location / { try_files $uri $uri/ /index.html; }

  location ~* \.(js|css|woff2?)$ { expires 7d; add_header Cache-Control "public, immutable"; }
}
